name: Weekly album list

on:
  schedule:
    - cron: "5 22 * * 0"   # Sunday 22:05 UTC = Monday 00:05 in South Africa
  workflow_dispatch:
  push:
    branches: [claude/determined-rubin-356fo3]
    paths: [catalog.js, scripts/draw-pool.mjs, .github/workflows/album-pool.yml]

permissions:
  contents: write
  pages: write

concurrency: album-pool

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Draw albums from Apple Music
        run: node scripts/draw-pool.mjs
        env:
          STOREFRONT: za
      - name: Commit the new list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add albums.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh weekly album list"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Republish the site
        # Pushes made by this workflow don't start a Pages build on their own.
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; it will publish on the next push."
        env:
          GH_TOKEN: ${{ github.token }}
